<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- h1 font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fascinate&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/old-london" rel="stylesheet">
    
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="../static/loader_1.css">
    <script src="../static/scripts.js" defer></script>

    <title>Painting Recommendation System</title>
</head>

<body>
    <h1> Painting Recommendation System </h1>
    <div class="header">
        <img src="{{ url_for('static', filename='angel1.png') }}" class="reflect">

        <div class="pages">
            <!--  <img src="../../UMLOGOonly_black.png" alt=" "> -->
            <button class="layered" data-href="{{ url_for('index') }}">
                <span class="btn-inner">
                    <span class="btn-text">Home</span>
                </span>
            </button>
            <button class="layered" data-href="{{ url_for('index') }}">
                <span class="btn-inner">
                    <span class="btn-text">Explore</span>
                </span>
            </button>
            <button class="layered" data-href="{{ url_for('create_board') }}">
                <span class="btn-inner">
                    <span class="btn-text">Create</span>
                </span>  
            </button>
            <!-- <a href="#" class="icon"><i class="fas fa-bell"></i></a> 
            <a href="#" class="icon"><i class="fas fa-comment-dots"></i></a>-->
        </div>

        <img src="{{ url_for('static', filename='angel1.png') }}">
    </div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="close-btn" id="closeModal">&times;</span>

            <img id="modalImage">

            <div class="modal-details">
                <div>
                    <!-- three dot menu -->
                    <div class="dropdown">
                        <!-- three dots -->
                        <ul class="dropbtn icons btn-right showLeft" onclick="showDropdown()">
                            <li></li>
                            <li></li>
                            <li></li>
                        </ul>
                        <!-- menu -->
                        <div id="myDropdown" class="dropdown-content">
                            <a> Why was this painting recommended? </a>
                            <a> What were the top contributing features?</a>
                            <a> Which painting regions contributed the most? </a>
                            <a> What would change this recommendation? </a>
                        </div>
                    </div>  
                </div>              
                <div class="image-container">
                    <div id="loader">
                        <svg xmlns="http://www.w3.org/2000/svg" height="200px" width="200px" viewBox="0 0 200 200" class="pencil">
                            <defs>
                                <clipPath id="pencil-eraser">
                                    <rect height="30" width="30" ry="5" rx="5"></rect>
                                </clipPath>
                            </defs>
                            <circle transform="rotate(-113,100,100)" stroke-linecap="round" stroke-dashoffset="439.82" stroke-dasharray="439.82 439.82" stroke-width="2" stroke="currentColor" fill="none" r="70" class="pencil__stroke"></circle>
                            <g transform="translate(100,100)" class="pencil__rotate">
                                <g fill="none">
                                    <circle transform="rotate(-90)" stroke-dashoffset="402" stroke-dasharray="402.12 402.12" stroke-width="30" stroke="hsl(223,90%,50%)" r="64" class="pencil__body1"></circle>
                                    <circle transform="rotate(-90)" stroke-dashoffset="465" stroke-dasharray="464.96 464.96" stroke-width="10" stroke="hsl(223,90%,60%)" r="74" class="pencil__body2"></circle>
                                    <circle transform="rotate(-90)" stroke-dashoffset="339" stroke-dasharray="339.29 339.29" stroke-width="10" stroke="hsl(223,90%,40%)" r="54" class="pencil__body3"></circle>
                                </g>
                                <g transform="rotate(-90) translate(49,0)" class="pencil__eraser">
                                    <g class="pencil__eraser-skew">
                                        <rect height="30" width="30" ry="5" rx="5" fill="hsl(223,90%,70%)"></rect>
                                        <rect clip-path="url(#pencil-eraser)" height="30" width="5" fill="hsl(223,90%,60%)"></rect>
                                        <rect height="20" width="30" fill="hsl(223,10%,90%)"></rect>
                                        <rect height="20" width="15" fill="hsl(223,10%,70%)"></rect>
                                        <rect height="20" width="5" fill="hsl(223,10%,80%)"></rect>
                                        <rect height="2" width="30" y="6" fill="hsla(223,10%,10%,0.2)"></rect>
                                        <rect height="2" width="30" y="13" fill="hsla(223,10%,10%,0.2)"></rect>
                                    </g>
                                </g>
                                <g transform="rotate(-90) translate(49,-30)" class="pencil__point">
                                    <polygon points="15 0,30 30,0 30" fill="hsl(33,90%,70%)"></polygon>
                                    <polygon points="15 0,6 30,0 30" fill="hsl(33,90%,50%)"></polygon>
                                    <polygon points="15 0,20 10,10 10" fill="hsl(223,10%,10%)"></polygon>
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>
                <h2 id="modalTitle"></h2>
                <h2 id="modalArtist"></h2>
                &nbsp; 
                <div>
                    <hr>
                    &nbsp; 
                    <p id="modalYear"> </p>
                    <p id="modalGenre"> </p>
                </div>
                
                <div id="paletteContainer"> </div> &nbsp;
                <p id="modalPaletteType"> &nbsp; </p>
                <p id="modalDescription"> </p>

                <div class="feedbackButtons">
                    <select name="Add To Gallary" id="addToGallary"> Add To Gallary
                        <option> Save To Gallary... </option>
                        <option id="addToGal" onclick="addToGallary()">Gallary Name</option>
                    </select>

                    <button id="addToFav" onclick="addToFavourites()">
                        <i class="fa-sm far fa-star"></i> Add To Favourites 
                    </button>
                    <button id="notInterested" onclick="notInterested()">
                        <i class="fa-sm fas fa-ban"></i> Not Interested
                    </button>                                    
                </div>
                <input id="review" type="text" placeholder="Write a review... ">
            </div>
        </div>
    </div>
    
    
    <div id="container">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
    </div>

    <!-- toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
