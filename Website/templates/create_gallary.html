<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- h1 font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fascinate&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/old-london" rel="stylesheet">

    <link rel="stylesheet" href="../static/styles.css">
    <script src="../static/create_gallary.js" defer></script>
    <script src="../static/scripts.js" defer></script>

    <title>Create Your Gallary</title>
</head>

<body>
    <h1>Create Your Gallary</h1>
    <div class="top-section">
        <img class="angel left-angel" src="{{ url_for('static', filename='angel3.png') }}" alt="Left Angel">

        <div class="pages">
            <button class="layered" data-href="{{ url_for('index') }}">
                <span class="btn-inner"><span class="btn-text">Home</span></span>
            </button>
            <button class="layered" data-href="{{ url_for('index') }}">
                <span class="btn-inner"><span class="btn-text">Explore</span></span>
            </button>
            <button class="layered" data-href="{{ url_for('create_gallary') }}">
                <span class="btn-inner"><span class="btn-text">Create</span></span>
            </button>
        </div>

        <img class="angel right-angel" src="{{ url_for('static', filename='angel2.png') }}" alt="Right Angel">
    </div>

    <div class="board-nav">
        <input type="text" id="searchBar" placeholder="Search">
    </div>

    <div id="board-overlay">
        <div class="board-section">
            <div class="board-grid">
                <!-- Favourites -->
                <button class="board favourites-board" data-href="{{ url_for('favourites') }}">
                    <div class="board-overlay-tint"></div>
                    <span class="board-label">Favourites</span>
                </button>
                
                <!-- Gallaries created by the user -->
                <button class="board">
                    <div class="board-overlay-tint"></div>
                    <span class="board-label"> </span>
                </button>

                <!-- Neural style transfer library -->
                <button class="board create-art" data-href="{{ url_for('style_transfer')}}">
                    <div class="board-overlay-tint"></div>
                    <span class="board-label">Create Art</span>
                </button>
            </div>
        </div>
    </div>
    

</body>
